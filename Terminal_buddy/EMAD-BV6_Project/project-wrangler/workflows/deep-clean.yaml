name: "Operation: Deep Wrangler"
description: "Forensic audit and reconstruction."
trigger: "clean-projects"

steps:
  - id: 1_audit
    agent: "metadata-analyst"
    instruction: "Run deep scan. Generate manifest."
  - id: 2_context
    agent: "content-specialist"
    instruction: "Tag projects. Add educational notes."
  - id: 3_strategy
    agent: "lead-archivist"
    instruction: "Define Keep/Kill list."
  - id: 4_safety
    agent: "forensic-specialist"
    instruction: "Verify safety. Create backup."
  - id: 5_move
    agent: "preservation-engineer"
    instruction: "Move and verify fixity."
