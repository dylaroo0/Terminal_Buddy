name: "Weekly Maintenance"
description: "A quick tidy-up routine."
trigger: "maintenance-routine"

steps:
  - id: 1_scan
    agent: "metadata-analyst"
    instruction: "Scan for loose files and 'Downloads' clutter."
  - id: 2_triage
    agent: "lead-archivist"
    instruction: "Quickly decide: File it, Trash it, or Git it."
  - id: 3_cleanup
    agent: "preservation-engineer"
    instruction: "Execute the moves and sync to Cloud."