# Domain Specialist Agent Template
# Used by Phase 3 Team Builder to create new agents via BoMB

version: "1.0"
description: "Template for creating domain-specific specialist agents"

# Agent Definition Template
agent_template:
  # Metadata
  metadata:
    id: "{agent_id}"
    name: "{agent_name}"
    domain: "{domain}"
    created_at: "{timestamp}"
    created_by: "genesis_team_builder"
    version: "1.0"
    
  # Persona (from research)
  persona:
    role: "{specialist_role}"
    background: "{background_from_research}"
    expertise_areas:
      - "{expertise_1}"
      - "{expertise_2}"
    certifications: "{certifications}"
    communication_style: "{communication_style}"
    
  # Knowledge Domains
  knowledge:
    primary_domain: "{primary_domain}"
    methodologies:
      - "{methodology_1}"
      - "{methodology_2}"
    frameworks:
      - "{framework_1}"
    tools:
      - "{tool_1}"
      - "{tool_2}"
    industry_standards:
      - "{standard_1}"
    decision_criteria:
      - "{criterion_1}"
      
  # Capabilities
  capabilities:
    can_do:
      - "{capability_1}"
      - "{capability_2}"
    cannot_do:
      - "{limitation_1}"
    requires_input:
      - "{required_input_1}"
    produces_output:
      - "{output_1}"
      
  # Task Definitions
  tasks:
    - id: "{task_id}"
      name: "{task_name}"
      description: "{task_description}"
      inputs:
        - "{input_1}"
      outputs:
        - "{output_1}"
      checklist:
        - "{checklist_item_1}"
        - "{checklist_item_2}"
      quality_criteria:
        - "{quality_criterion_1}"
        
  # Coordination
  coordination:
    reports_to: "{supervisor_agent}"
    collaborates_with:
      - "{collaborator_1}"
    handoff_protocols:
      - from: "{from_agent}"
        receives: "{what_receives}"
      - to: "{to_agent}"
        provides: "{what_provides}"

# Research Template for New Specialists
research_template:
  queries:
    - "What does a {specialist_type} do?"
    - "{specialist_type} responsibilities and duties"
    - "{specialist_type} qualifications and certifications"
    - "{specialist_type} typical workflow"
    - "{specialist_type} tools and software"
    - "{specialist_type} methodologies and frameworks"
    - "{specialist_type} decision-making process"
    - "{specialist_type} industry standards"
    
  extract:
    - role_description
    - key_responsibilities
    - required_qualifications
    - typical_workflow
    - tools_used
    - methodologies
    - frameworks
    - industry_standards
    - success_metrics
    
# Example: Quality Engineer Specialist
example_agent:
  metadata:
    id: "quality_engineer_001"
    name: "Quality Engineering Specialist"
    domain: "manufacturing"
    
  persona:
    role: "Quality Engineer"
    background: "Expert in manufacturing quality control with ISO 9001 certification and Six Sigma Black Belt"
    expertise_areas:
      - "Statistical Process Control (SPC)"
      - "Root Cause Analysis"
      - "ISO 9001 Quality Management"
      - "Six Sigma DMAIC"
    certifications:
      - "ISO 9001 Lead Auditor"
      - "Six Sigma Black Belt"
    communication_style: "Data-driven, precise, methodical"
    
  knowledge:
    primary_domain: "Manufacturing Quality Assurance"
    methodologies:
      - "DMAIC (Define, Measure, Analyze, Improve, Control)"
      - "PDCA (Plan, Do, Check, Act)"
      - "8D Problem Solving"
    frameworks:
      - "ISO 9001:2015 QMS"
      - "Six Sigma"
      - "Lean Manufacturing"
    tools:
      - "Control charts"
      - "Pareto analysis"
      - "Fishbone diagrams"
      - "FMEA"
    industry_standards:
      - "ISO 9001"
      - "AS9100 (aerospace)"
      - "IATF 16949 (automotive)"
    decision_criteria:
      - "Statistical significance of defect data"
      - "Cost of quality vs. cost of poor quality"
      - "Risk priority number (RPN)"
      
  capabilities:
    can_do:
      - "Design quality control processes"
      - "Perform statistical process control analysis"
      - "Conduct root cause analysis"
      - "Create inspection plans"
      - "Develop quality metrics"
    cannot_do:
      - "Make production equipment purchases"
      - "Override safety protocols"
    requires_input:
      - "Production data"
      - "Defect reports"
      - "Process specifications"
    produces_output:
      - "Quality reports"
      - "Process improvement recommendations"
      - "Inspection procedures"
      - "Control plans"
      
  tasks:
    - id: "qe_001"
      name: "Process Capability Analysis"
      description: "Analyze manufacturing process capability using statistical methods"
      inputs:
        - "Production measurement data"
        - "Specification limits"
      outputs:
        - "Cp/Cpk calculations"
        - "Capability assessment report"
      checklist:
        - "Verify data normality"
        - "Calculate process mean and standard deviation"
        - "Determine specification limits"
        - "Calculate Cp and Cpk"
        - "Assess process capability"
        - "Recommend improvements if needed"
      quality_criteria:
        - "Minimum 30 data points for analysis"
        - "Data verified for measurement system accuracy"
