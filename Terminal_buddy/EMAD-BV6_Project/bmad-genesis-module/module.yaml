id: genesis
name: "BMad Genesis: The Architect"
version: 1.0.0-alpha.1
type: stand-alone
description: >
  Meta-architect module that analyzes projects, constructs bespoke agent teams,
  and generates executable workflows. Integrates AgentScope for fault-tolerant
  orchestration and Memvid for portable video-based memory.
author: "dylaroo"
tags: ["architect", "meta-team", "agentscope", "memvid", "genesis"]

# ------------------------------------------------------------------
# MODULE DEPENDENCIES
# ------------------------------------------------------------------
dependencies:
  system:
    - python >= 3.10
  python_packages:
    - agentscope
    - memvid
    - pyyaml
  bmad_modules:
    - core  # Requires BMad Core for base functionality

# ------------------------------------------------------------------
# OUTPUT CONFIGURATION
# ------------------------------------------------------------------
output:
  default_path: "_bmad-output/genesis"
  planning_artifacts: "_bmad-output/genesis/planning"
  team_artifacts: "_bmad-output/genesis/teams"
  memory_files: "_bmad-output/genesis/memory"

# ------------------------------------------------------------------
# AGENT REGISTRY
# ------------------------------------------------------------------
agents:
  - id: genesis-auditor
    name: "The Deep Auditor"
    file: agents/auditor.md
    icon: "🔍"
    description: "Recursively analyzes project files to determine maturity and tech stack"
    tts_enabled: true
    tts_voice: "professional_male"

  - id: genesis-builder
    name: "The Team Builder"
    file: agents/team-builder.md
    icon: "👷"
    description: "Constructs optimal agent teams based on Auditor findings"
    tts_enabled: true
    tts_voice: "confident_female"

  - id: genesis-weaver
    name: "The Workflow Weaver"
    file: agents/workflow-weaver.md
    icon: "🕸️"
    description: "Designs AgentScope-compatible workflows with dependency tracking"
    tts_enabled: true
    tts_voice: "analytical_neutral"

  - id: genesis-strategist
    name: "The Growth Strategist"
    file: agents/strategist.md
    icon: "🚀"
    description: "Analyzes market fit and generates GTM strategies"
    tts_enabled: true
    tts_voice: "energetic_female"

# ------------------------------------------------------------------
# WORKFLOW REGISTRY
# ------------------------------------------------------------------
workflows:
  - id: genesis-onboarding
    name: "Full Project Genesis"
    file: workflows/project-onboarding.yaml
    description: "End-to-end flow: Audit -> Build Team -> Plan Workflow -> Market Strategy"
    entry_point: true

  - id: genesis-analyze
    name: "Project Analysis Only"
    file: workflows/analyze-project.yaml
    description: "Run Deep Auditor to analyze project DNA"

  - id: genesis-team-gen
    name: "Team Generation"
    file: workflows/generate-team.yaml
    description: "Generate agent team from existing project DNA"

# ------------------------------------------------------------------
# INSTALLATION HOOKS
# ------------------------------------------------------------------
install:
  pre_install: |
    echo "🔍 Genesis: Checking dependencies..."
    python3 -c "import sys; sys.exit(0 if sys.version_info >= (3, 10) else 1)" || {
      echo "❌ Python 3.10+ required"
      exit 1
    }
  
  post_install: |
    echo "📦 Installing Genesis dependencies..."
    pip install agentscope memvid pyyaml --break-system-packages 2>/dev/null || pip install agentscope memvid pyyaml
    
    echo "🎬 Genesis installation complete!"
    echo ""
    echo "Available commands:"
    echo "  - *genesis            : Start Genesis Orchestrator"
    echo "  - *genesis-analyze    : Analyze a project"
    echo "  - *genesis-team       : Generate agent team"
    echo ""
    echo "Genesis uses AgentScope + Memvid for intelligent team generation."

# ------------------------------------------------------------------
# METADATA
# ------------------------------------------------------------------
metadata:
  repository: "https://github.com/dylaroo/bmad-genesis"
  documentation: "https://github.com/dylaroo/bmad-genesis/blob/main/README.md"
  license: "MIT"
  bmad_version: ">=6.0.0-alpha.20"
