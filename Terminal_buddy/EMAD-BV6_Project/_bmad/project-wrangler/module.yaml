id: project-wrangler
name: "Project Wrangler (GitHub & Routine Edition)"
description: "The ultimate cleanup crew. Wrangling files, automating GitHub pushes, and establishing organizational routines to keep you creative."
version: "2.0.0"
category: "productivity"
tags: ["organization", "github", "routines", "recovery", "wrangler"]
authors: ["Morgan", "dylaroo"]

agents:
  - id: lead-archivist
    path: agents/archivist.md
    description: "The Instructor. Sets the schedule, manages the team, and keeps you on track."
  - id: forensic-specialist
    path: agents/forensic.md
    description: "The Carver. Ensures safety before any move or delete."
  - id: metadata-analyst
    path: agents/metadata.md
    description: "The Sorter. Finds patterns and organizes the chaos."
  - id: preservation-engineer
    path: agents/preservation.md
    description: "The Repo Manager. Handles GitHub, Cloud Backups, and Git History."
  - id: content-specialist
    path: agents/content.md
    description: "The Hype Man. Writes READMEs and Context so your repos look good."

workflows:
  - id: wrangler-github-launch
    path: workflows/github-launch.yaml
    name: "Launch to GitHub"
    description: "Takes a local folder, inits git, writes a README, and pushes to a new Repo."
  - id: wrangler-maintenance
    path: workflows/maintenance-routine.yaml
    name: "Weekly Maintenance"
    description: "A quick scan workflow to keep folders tidy."