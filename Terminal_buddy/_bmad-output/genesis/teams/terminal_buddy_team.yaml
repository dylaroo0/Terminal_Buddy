**Topology Type:** Pipeline with Hub-and-Spoke coordination

- **Scrum Master** coordinates all communication
- **Frontend Architect** leads technical implementation
- **Specialists** work in sequence (Terminal → Voice → Memvid)
- **QA** validates all completed work

---

## Communication Rules

1. **Daily Standup** - All agents report status to Scrum Master (async, written)
2. **Technical Decisions** - Frontend Architect makes final call, consults specialists
3. **Blockers** - Immediately report to Scrum Master for resolution
4. **QA Handoff** - Specialists self-test, then QA validates
5. **Creator Updates** - Scrum Master provides daily summary to Dylaroo

---

## Handoff Protocols

### Terminal → Voice
- **From:** Terminal Emulator Specialist
- **To:** Voice Specialist
- **Artifact:** Working terminal pane with input/output
- **Trigger:** Terminal accepts keyboard input, executes commands, shows output
- **Validation:** Voice specialist can manually type commands and see results

### Terminal + Voice → Memvid
- **From:** Terminal + Voice Specialists
- **To:** Memvid Architect
- **Artifact:** Terminal data stream + voice transcription events
- **Trigger:** Both terminal and voice working independently
- **Validation:** Memvid architect can capture terminal sessions and voice events

### All Implementation → QA
- **From:** All Specialists
- **To:** QA Engineer
- **Artifact:** Completed features with self-test
- **Trigger:** Feature complete, self-tested by specialist
- **Validation:** QA runs WCAG audit, cross-platform tests, accessibility checklist

### QA → Creator Demo
- **From:** QA Engineer
- **To:** Dylaroo
- **Artifact:** Full integrated demo
- **Trigger:** All features pass QA
- **Validation:** Creator approves and signs off

