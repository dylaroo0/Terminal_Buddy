[workspace]
members = ["buddy-daemon", "shared", "buddy-app/src-tauri"]
resolver = "2"

[workspace.dependencies]
# MCP Server
rmcp = { version = "0.16", features = ["server", "transport-io", "macros"] }

# Async Runtime
tokio = { version = "1.40", features = ["full"] }

# PTY Management
portable-pty = "0.8"

# System Monitoring
sysinfo = "0.30"
notify = { version = "6.1", features = ["macos_fsevent"] }

# Storage
rusqlite = { version = "0.31", features = ["bundled"] }
zstd = "0.13"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"

# Schema generation (required by rmcp)
schemars = "1.0"

# Error Handling
anyhow = "1"
thiserror = "1"

# Utilities
uuid = { version = "1.0", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = "0.3"
toml = "0.8"
dirs = "5.0"
