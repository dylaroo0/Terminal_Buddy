[workspace]
members = ["ui", "daemon", "shared"]
resolver = "2"

[workspace.dependencies]
# UI / Rendering
tauri = { version = "2.0.0-rc" }
alacritty_terminal = "0.22"

# Daemon / System
tokio = { version = "1.40", features = ["full"] }
portable-pty = "0.8"
sysinfo = "0.30"

# Memory Data & IPC
rusqlite = "0.31"
bincode = "1.3"
serde = { version = "1.0", features = ["derive"] }

# Error Handling
anyhow = "1"
thiserror = "1"
